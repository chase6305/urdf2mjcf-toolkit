name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CTEST_PARALLEL_LEVEL: "1"
  MAX_JOBS: "2"
  RAYON_NUM_THREADS: "2"
  BLACK_NUM_WORKERS: "2"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip '.[dev,visualization]'

      - name: Run tests
        run: python -m pytest

      - name: Check Python sources
        run: python -m compileall -q urdf2mjcf kit tests

      - name: Check formatting and lint
        run: |
          black --check .
          ruff check .

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
