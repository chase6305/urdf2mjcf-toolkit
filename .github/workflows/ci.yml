name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip '.[dev,visualization]'

      - name: Run tests
        run: python -m pytest

      - name: Check Python sources
        run: python -m compileall -q urdf2mjcf kit tests

      - name: Check formatting and lint
        run: |
          black --check .
          ruff check .

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
